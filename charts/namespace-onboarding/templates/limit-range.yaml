apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: {{ .Values.team.name }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.resources.defaults.requestsCpu | quote }}
        memory: {{ .Values.resources.defaults.requestsMemory | quote }}
      default:
        cpu: {{ .Values.resources.defaults.limitsCpu | quote }}
        memory: {{ .Values.resources.defaults.limitsMemory | quote }}
